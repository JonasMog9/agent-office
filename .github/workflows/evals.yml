name: Agent evals

# Runs the agent evals against the real Claude API. Manual only: it costs money
# (about $1–2 for the production setup, cents for all-haiku). Needs the repository
# secret ANTHROPIC_API_KEY. Results: the run's summary page, and the eval-results artifact.
on:
  workflow_dispatch:
    inputs:
      setups:
        description: "Model setups, comma-separated (production, all-haiku)"
        default: "production,all-haiku"
      cases:
        description: "Case ids, comma-separated, or all"
        default: "all"

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m app.evals.run --setups "$SETUPS" --cases "$CASES" --out eval-results
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SETUPS: ${{ inputs.setups }}
          CASES: ${{ inputs.cases }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: backend/eval-results/
